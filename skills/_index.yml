shared_rules:
  authentication: >-
    OAuth 2.0 client_credentials at POST /v1/oauth/access_token. Bearer token, 3600-second TTL,
    no refresh grant. Re-exchange on a timer, not on a 401.
  async: >-
    Every search, enrichment and verification is a POST .../start returning task_hash, polled at
    GET .../result until status is completed. No failure terminal state is published — set your
    own deadline.
  rate_limit: >-
    60 requests per minute, account-wide. No RateLimit-*, no X-RateLimit-*, no Retry-After. Pace
    at 1 req/s by construction.
  idempotency: >-
    None. Never blindly retry a credit-consuming POST; check state or balance first.
  metering: >-
    Credits are charged per RESULT, not per request, and several operations are free when they
    return nothing. Guard batches with getUserBalance.
  errors: >-
    Two incompatible envelopes. The router returns {"errors":{"code","title","source"}} (object);
    operations return {"success":false,"errors":[...]} (array). Handle both.
  versioning: >-
    v1 and v2 are disjoint slices of one API, not generations. Prefixes are never interchangeable.
