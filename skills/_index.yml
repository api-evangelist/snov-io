  https://snov.io/api
description: >-
  Packaged Agent Skills for the Snov.io REST API. Every operationId referenced in these skills
  exists in openapi/; none was invented. Each skill carries the cross-cutting rules an agent
  gets wrong by default on this API — the two-step async task_hash pattern, the 3600-second
  token, the 60 req/min cap with no rate-limit headers, per-result credit metering, the absence
  of idempotency, and the two incompatible error envelopes.
  Snov.io publishes no skills, no AGENTS.md and no llms.txt; these are API Evangelist
  generations. Snov.io's own agent surface is its remote MCP server — see mcp/snov-io-mcp.yml.

