api_access:
  rest_api:
    included_from: Starter
    trial: false
    note: >-
      Snov.io's API reference states that free-plan users must "request test access by booking a
      personal demo with us" — the REST API is not self-serve on Trial.
    source: https://snov.io/api
  mcp_server:
    included_from: Trial
    all_plans: true
    note: >-
      "Snov.io MCP is available across all plans, including the free Trial." MCP actions draw on
      the same credit, recipient and LinkedIn slot quotas as the rest of the platform, so the
      agent surface is metered but not gated.
    source: https://snov.io/mcp
