name: Snov.io Change Log
specificationVersion: '0.1'
generated: '2026-08-13'
method: searched
source: https://snov.io/release-notes
description: >-
  Snov.io publishes a product release-notes page and a Telegram updates channel. Neither is an
  API changelog: there is no versioned, dated record of API additions, changes or removals
  anywhere on the site, and the release-notes page itself is client-rendered — a server-side
  fetch returns the site chrome plus "No results found" and zero entries.

scheme: product-release-notes
api_specific: false
machine_readable: false
feed: none
versioned: false

sources:
  - url: https://snov.io/release-notes
    http_status: 200
    readable: false
    note: >-
      Client-rendered. A non-JavaScript fetch returns 2.9 KB of navigation chrome and no dated
      entries. Recorded as unreadable, not as absent.
  - url: https://t.me/snovioupdates
    type: telegram
    note: Secondary update channel linked from the developer reference at https://snov.io/api.
  - url: https://snov.io/blog/
    type: blog
    note: >-
      Snov.io ships a monthly "product updates" post to its blog, which is the only DATED update
      record reachable without JavaScript. The entries below were read from posts already
      captured in this repo's blogs/ directory during a prior pull.

entries:
