description: Snov.io is a sales automation and lead generation platform serving over 300,000 companies
  across 180+ countries. The platform provides a REST API enabling developers to programmatically access
  email finding, domain search, email verification, drip campaign management, and LinkedIn prospect automation.
  Authentication uses OAuth 2.0 client credentials to obtain short-lived Bearer tokens, and all API operations
  consume credits from the account balance. The API covers the full sales outreach lifecycle from prospect
  discovery and contact enrichment through multi-channel campaign execution and CRM pipeline management.
  Snov.io also operates a first-party remote Model Context Protocol server at https://mcp.snov.io/mcp,
  documented as exposing more than 100 actions to AI assistants and gated by a separate OAuth authorization
  code flow with PKCE and dynamic client registration. The two surfaces are disjoint — campaigns, warm-up,
  sender accounts and webhooks are REST-only, while Sales CRM writes and all LinkedIn outreach actions are
  reachable only over MCP.
tags:
