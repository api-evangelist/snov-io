name: Snov.io API Rate Limits
specificationVersion: '0.1'
generated: '2026-08-13'
method: searched
source: https://snov.io/api
limit_count: 3
description: >-
  Snov.io enforces a global rate limit of 60 requests per minute across all
  API methods. Authentication tokens (OAuth 2.0 Bearer) expire after 3600
  seconds (1 hour) and must be refreshed. Operations also consume account
  credits; credit quotas are determined by the active subscription plan.
source: https://snov.io/api

limits:
  - name: Global Request Rate Limit
    description: >-
      Maximum number of API requests allowed per minute across all endpoints
      and all API methods for a given account.
    scope: account
    window: 60
    windowUnit: seconds
    requests: 60
    enforcement: hard

  - name: Access Token Expiry
    description: >-
      OAuth 2.0 Bearer tokens issued via POST /v1/oauth/access_token expire
      after 3600 seconds. Callers must request a new token before the current
      one expires to maintain uninterrupted API access.
    scope: token
    window: 3600
    windowUnit: seconds
    enforcement: hard

  - name: Email Verification Batch Size
    description: >-
      A single POST /v2/email-verification/start request accepts a maximum of
      10 email addresses per call.
    scope: request
    maxItems: 10
    enforcement: hard

creditCosts:
  description: >-
    Most API operations consume account credits. Credit balances are set by the
    active subscription plan and do not carry over between billing periods
    except on Custom Ultra plans.
  operations:
    - operation: Domain Search (initial lookup)
      credits: 1
    - operation: Prospect profile with email found
      credits: 1
      note: Per result returned
    - operation: Email Finder by name and domain (valid/unknown)
      credits: 1
      note: Per valid or unknown result
    - operation: Company domain lookup
      credits: 1
      note: Per domain found
    - operation: LinkedIn profile enrichment
      credits: 1
      note: Per profile
    - operation: Email verification (valid/unknown result)
      credits: 1
      note: Free if unverifiable
    - operation: Profile enrichment by email
      credits: 1
      note: Free if no results returned
    - operation: Check email count for domain
      credits: 0
      note: FREE endpoint
    - operation: Get email accounts list
      credits: 0
      note: FREE endpoint

responseSignalling:
  headers: []
  statusOnExhaustion: null
  retryAfter: false
  checked: '2026-08-13'
  source: https://snov.io/api
  note: >-
    Snov.io returns NO runtime rate-limit signal. There is no RateLimit-* (RFC 9331), no
    X-RateLimit-Limit/Remaining/Reset, and no Retry-After header documented on any operation or
    observed on any probe. The status code returned when the 60/minute cap is breached is not
    documented either — "429" appears exactly once in the 242 KB developer reference and not as
    a declared response. A client therefore cannot discover its remaining budget or back off on
    signal; it must pace at one request per second by construction and treat any unexplained
    failure during a burst as a possible throttle.

creditSignalling:
  balanceOperation: getUserBalance
  endpoint: GET https://api.snov.io/v1/get-balance
  cost: free
  fields:
    - balance
    - teamwork
    - unique_recipients_used
    - limit_resets_in
    - expires_in
  note: >-
    The only quota visibility Snov.io offers is a poll. There is no header carrying remaining
    credits on the responses that consume them, so an agent must call getUserBalance before a
    batch and cannot detect mid-batch exhaustion except by the operation failing.

